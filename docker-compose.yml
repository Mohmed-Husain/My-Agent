version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: my-agent-postgres
    restart: always
    environment:
      POSTGRES_USER: agent_user
      POSTGRES_PASSWORD: agent_password
      POSTGRES_DB: agent_portfolio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: my-agent-backend
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://agent_user:agent_password@db:5432/agent_portfolio
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: deepseek-chat
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data:
